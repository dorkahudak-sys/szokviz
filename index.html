<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Műszaki angol szókvíz 🌸</title>
<style>
:root{--bg:#fdeef4;--card:#fff;--ink:#3a1230;--mute:#8a5a78;--line:#f3c9dc;--acc:#d6336c;--accink:#fff;--ok:#1b7f4b;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2a0f1f;--card:#3b1730;--ink:#ffe8f1;--mute:#d9a3bd;--line:#5c2a47;--acc:#ff7eb0;--accink:#2a0f1f;--ok:#4cc38a;--bad:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#2a0f1f;--card:#3b1730;--ink:#ffe8f1;--mute:#d9a3bd;--line:#5c2a47;--acc:#ff7eb0;--accink:#2a0f1f;--ok:#4cc38a;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:4px 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 18px;color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
label.row{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:16px}
label.row input{width:20px;height:20px;accent-color:var(--acc)}
label.row small{color:var(--mute);margin-left:auto}
button{font:inherit;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:var(--accink);padding:12px 18px;min-height:46px;cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.full{width:100%}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:12px}
.q{font-size:26px;font-weight:600;margin:6px 0 16px;overflow-wrap:anywhere}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fb{min-height:48px;margin:12px 0;font-size:16px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.btns{display:flex;gap:10px}.btns button{flex:1}
.big{font-size:44px;font-weight:700;margin:0}
ul.wrong{padding-left:18px;margin:8px 0}
.hide{display:none}
.avg{display:grid;grid-template-columns:80px 1fr 96px;gap:8px;align-items:center;margin:8px 0}
.pl{display:flex;gap:10px;margin-bottom:6px}.pl label{flex:1;position:relative;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer}.pl input{position:absolute;opacity:0}.pl label:has(input:checked){border-color:var(--acc);background:var(--bg);font-weight:700}.pl label:has(input:focus-visible){outline:3px solid var(--acc)}
table.sb{width:100%;border-collapse:collapse;font-size:15px}table.sb td{padding:6px 4px;border-top:1px solid var(--line)}.code{font-size:14px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>Műszaki angol szókvíz</h1>
  <p class="sub">Magyar szó jön, te beírod az angol megfelelőjét.</p>
  <div class="card" id="units"></div>
  <div class="card">
    <div class="pl" role="radiogroup" aria-label="Ki játszik?"><label><input type="radio" name="who" value="Dorka" checked><span>Dorka</span></label><label><input type="radio" name="who" value="Dominik"><span>Dominik</span></label></div><label class="row">Körkód <input type="text" id="code" value="1" style="width:90px;height:auto" aria-label="Körkód"><small>ugyanaz a kód = ugyanaz a sorrend</small></label><label class="row"><input type="checkbox" id="shuffle" checked> Kevert sorrend</label><label class="row">Szavak száma <select id="cnt" style="margin-left:auto;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option><option value="0">Mind</option></select></label>
    <label class="row"><input type="checkbox" id="lenient" checked> A „to” elhagyható az igék elől</label>
    <label class="row"><input type="checkbox" id="typo" checked> Egy elütés elfogadott</label>
  </div>
  <button class="full" id="start">Kezdés</button>
  <div class="card" style="margin-top:14px"><strong>Eredmények</strong> <small style="color:var(--mute)">közös, magától frissül</small><p class="sub" style="margin:10px 0 0">Átlagos eredmény</p><div id="avg"></div><div id="board"></div><p class="sub" id="st" style="margin:8px 0 0;font-size:13px"></p><input type="text" id="imp" class="hide" placeholder="Másik eredménykódja ide" aria-label="Eredménykód"><button class="ghost full hide" id="impb" style="margin-top:8px">Hozzáadás</button></div>
</section>

<section id="quiz" class="hide">
  <div class="bar"><i id="prog"></i></div>
  <div class="meta"><span id="count"></span><span id="score"></span></div>
  <div class="card">
    <div class="q" id="hu"></div>
    <input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Angolul…" aria-label="Angol megfelelő">
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="btns">
      <button class="ghost" id="skip">Nem tudom</button>
      <button id="check">Ellenőrzés</button>
    </div>
  </div>
</section>

<section id="done" class="hide">
  <div class="card">
    <p class="big" id="final"></p>
    <p id="msg" class="sub"></p>
    <div id="mycode" class="hide"><strong>Küldd el a másiknak ezt a kódot:</strong><div class="code" id="codetxt"></div><button class="ghost full" id="copyb">Másolás</button></div><div id="wrongbox" class="hide"><strong>Ezeket gyakorold még:</strong><ul class="wrong" id="wrongs"></ul></div>
  </div>
  <div class="btns">
    <button class="ghost" id="home2">Főoldal</button>
    <button id="retry">Hibásak újra</button>
  </div>
</section>
</main>

const $=id=>document.getElementById(id);
const show=id=>["home","quiz","done"].forEach(s=>$(s).classList.toggle("hide",s!==id));
$("units").innerHTML=Object.keys(U).map((k,i)=>`<label class="row"><input type="checkbox" value="${k}" checked> ${k}<small>${U[k].length} szó</small></label>`).join("");
let deck=[],i=0,ok=0,wrong=[],answered=false;
const norm=(s,len)=>{s=s.toLowerCase().replace(/[()]/g,"").replace(/[-–]/g," ").replace(/\s+/g," ").trim();if(len)s=s.replace(/^to /,"");return s};
function accepted(en,len){const set=new Set([norm(en,len)]);en.split("/").forEach(p=>{p=p.trim();if(p)set.add(norm(p,len))});
 if(en.includes("/")&&en.startsWith("tight/close")){set.add("tight tolerance");set.add("close tolerance")}return set}
let ranked=false,t0=0,unitKey="",mem=[];
const store={get(){try{return JSON.parse(localStorage.getItem("szokviz-r")||"[]")}catch(e){return mem}},set(a){mem=a;try{localStorage.setItem("szokviz-r",JSON.stringify(a))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function rng(seed){let h=0;for(const c of String(seed))h=Math.imul(31,h)+c.charCodeAt(0)|0;return()=>{h=h+0x6D2B79F5|0;let t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function parse(c){const p=c.trim().split(";");if(p.length<6)return null;const o={n:p[0],s:+p[1],t:+p[2],sec:+p[3],c:p[4],u:p[5]};return(!o.n||isNaN(o.s)||isNaN(o.t)||isNaN(o.sec))?null:o}
function addRes(c){const o=parse(c);if(!o)return false;const a=store.get();if(!a.some(x=>x.n===o.n&&x.s===o.s&&x.sec===o.sec&&x.c===o.c&&x.u===o.u))a.push(o);store.set(a);return true}
function renderBoard(){draw(store.get());sync()}
function draw(a){avgChart(a);if(!a.length){$("board").innerHTML='<p class="sub">Még nincs eredmény.</p>';return}const g={};a.forEach(x=>(g[x.c+"|"+x.u+"|"+x.t]=g[x.c+"|"+x.u+"|"+x.t]||[]).push(x));$("board").innerHTML=Object.keys(g).map(k=>{const l=g[k].sort((x,y)=>y.s/y.t-x.s/x.t||x.sec-y.sec),[c,u,t]=k.split("|");return `<p class="sub" style="margin:10px 0 2px">Körkód: ${esc(c)}, egységek: ${esc(u)}, ${esc(t)} szó</p><table class="sb">`+l.map((x,i)=>`<tr><td>${esc(x.n)}</td><td style="width:34%"><div class="bar" style="margin:0"><i style="width:${pc(x)}%"></i></div></td><td>${x.s}/${x.t} ${em(pc(x))}</td><td>${Math.floor(x.sec/60)}:${String(x.sec%60).padStart(2,"0")}</td></tr>`).join("")+"</table>"}).join("")}
const SB="https://kpsnrmyjotogwwygpcke.supabase.co/rest/v1/results",KEY="sb_publishable_uUXaibcpjGwB3VkcT7i3zQ_O99RpY2l",H={apikey:KEY,"Content-Type":"application/json"};
async function sync(){try{const r=await fetch(SB+"?select=name,score,total,secs,code,units&order=created_at.desc&limit=500",{headers:H});if(!r.ok){$("st").textContent="⚠ Szinkron hiba: "+r.status+" "+(await r.text()).slice(0,120);return}const rows=await r.json(),a=store.get();rows.forEach(x=>{const o={n:x.name,s:x.score,t:x.total,sec:x.secs,c:x.code,u:x.units};if(!a.some(y=>y.n===o.n&&y.s===o.s&&y.sec===o.sec&&y.c===o.c&&y.u===o.u))a.push(o)});store.set(a);draw(a);$("st").textContent="✓ Szinkronizálva ("+rows.length+" eredmény az adatbázisban)"}catch(e){$("st").textContent="⚠ Nincs kapcsolat az adatbázissal: "+e.message}}
function post(o){try{fetch(SB,{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify({name:o.n,score:o.s,total:o.t,secs:o.sec,code:o.c,units:o.u})}).then(async r=>{if(!r.ok)$("st").textContent="⚠ Mentés hiba: "+r.status+" "+(await r.text()).slice(0,120);else sync()}).catch(e=>{$("st").textContent="⚠ Mentés nem sikerült: "+e.message})}catch(e){}}
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
const pc=x=>Math.round(x.s/x.t*100),em=p=>p>=80?"👑":p<60?"💩":"";
function avgChart(a){const m={};a.forEach(x=>{(m[x.n]=m[x.n]||[]).push(pc(x))});$("avg").innerHTML=Object.keys(m).map(n=>{const v=m[n],p=Math.round(v.reduce((s,y)=>s+y,0)/v.length);return `<div class="avg"><span>${esc(n)}</span><div class="bar" style="margin:0"><i style="width:${p}%"></i></div><b>${p}% ${em(p)}</b></div>`}).join("")}
function begin(words,rk){deck=words.slice();const r=rng($("code").value.trim()||"1");if($("shuffle").checked)for(let k=deck.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]]}if(rk){const n=+$("cnt").value;if(n&&n<deck.length)deck=deck.slice(0,n)}i=0;ok=0;wrong=[];ranked=!!rk;t0=Date.now();show("quiz");next()}
function next(){if(i>=deck.length)return finish();answered=false;const w=deck[i];$("hu").textContent=w.hu;$("ans").value="";$("ans").disabled=false;$("fb").textContent="";$("fb").className="fb";
 $("check").textContent="Ellenőrzés";$("skip").classList.remove("hide");$("count").textContent=(i+1)+" / "+deck.length;$("score").textContent="Jó: "+ok;$("prog").style.width=(i/deck.length*100)+"%";$("ans").focus()}
function grade(skip){if(answered){i++;return next()}
 const w=deck[i],len=$("lenient").checked,got=norm($("ans").value,len),acc=accepted(w.en,len),exact=acc.has(got),typo=!exact&&$("typo").checked&&got&&[...acc].some(z=>z.length>=4&&lev(z,got)<=1),good=!skip&&(exact||typo);
 answered=true;$("ans").disabled=true;$("skip").classList.add("hide");
 if(good){ok++;$("fb").className="fb ok";$("fb").textContent=(typo?"Elütéssel elfogadva ✓ Helyesen: ":"Helyes! ✓ ")+w.en}else{wrong.push(w);$("fb").className="fb bad";$("fb").textContent="Nem egyezik. Helyesen: "+w.en}
 $("score").textContent="Jó: "+ok;$("check").textContent=i+1>=deck.length?"Eredmény":"Következő"}
function finish(){$("prog").style.width="100%";show("done");const p=Math.round(ok/deck.length*100);$("final").textContent=ok+" / "+deck.length+" ("+p+"%) "+em(p);
 $("msg").textContent=(p>=80?"👑 Egy sztár vagy! Te vagy a nap királya, te vagy a legokosabb!":p>=60?"HÁT BÜSZKE 3ASRA ÉRTÉKELLEK":"💩 Sokat kell még tanulnod, nem vagy alkalmas a ZH-ra!")+(wrong.length?" Még "+wrong.length+" szót érdemes átnézni.":"");
 $("wrongbox").classList.toggle("hide",!wrong.length);$("wrongs").innerHTML=wrong.map(w=>`<li>${w.hu} → <b>${w.en}</b></li>`).join("");$("retry").classList.toggle("hide",!wrong.length);$("mycode").classList.add("hide");if(ranked){ranked=false;const who=document.querySelector('input[name=who]:checked').value,sec=Math.round((Date.now()-t0)/1000),code=[who,ok,deck.length,sec,$("code").value.trim()||"1",unitKey].join(";");addRes(code);post(parse(code));$("codetxt").textContent=code}renderBoard()}
$("start").onclick=()=>{const sel=[...document.querySelectorAll("#units input:checked")].flatMap(c=>U[c.value]);if(!sel.length)return;unitKey=[...document.querySelectorAll("#units input:checked")].map(c=>c.value.split(".")[0]).join(",");begin(sel,true)};
$("check").onclick=()=>grade(false);$("skip").onclick=()=>grade(true);
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter")grade(false)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&answered&&!$("quiz").classList.contains("hide")){grade(false)}});
$("retry").onclick=()=>begin(wrong);$("home2").onclick=()=>show("home");
$("impb").onclick=()=>{if(addRes($("imp").value)){$("imp").value="";renderBoard()}else $("imp").placeholder="Hibás kód, másold be újra"};
$("copyb").onclick=()=>{try{navigator.clipboard.writeText($("codetxt").textContent);$("copyb").textContent="Átmásolva"}catch(e){}};
renderBoard();
</script>
